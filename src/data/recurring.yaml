# Weekly group runs. Each one shows up on the calendar for the next 6 weeks.
# Use `starts` / `ends` (YYYY-MM-DD) for seasonal runs, and `skip` for dates it doesn't run.

- id: mill-city-highland-monday
  name: Highland Community Run
  weekday: Mon
  start_time: "18:00"
  type: group-run
  distances: [2–7 mi]
  venue: 767 Cleveland Ave S (Mill City Running Highland)
  city: St. Paul
  host: Mill City Running
  url: https://www.millcityrunning.com/pages/group-runs
  description: >-
    Everyone starts together for about a mile, then splits into pace groups from sub-7
    to 13+ min/mile, plus a walking group. Routes alternate weekly (Team Northbound vs.
    Team Southbound). Sign the waiver before your first run.
  added: 2026-10-23

- id: mill-city-northeast-tuesday
  name: Northeast Community Run
  weekday: Tue
  start_time: "18:00"
  type: group-run
  venue: 411 E Hennepin Ave (Mill City Running Northeast)
  city: Minneapolis
  host: Mill City Running
  url: https://www.millcityrunning.com/pages/calendar
  description: Weekly community run from the Northeast store, 6:00 to 7:30 PM.
  added: 2026-11-02

- id: mill-city-fresh-coffee-friday
  name: Fresh Coffee Friday @ Northeast
  weekday: Fri
  start_time: "06:30"
  type: social
  venue: 411 E Hennepin Ave (Mill City Running Northeast)
  city: Minneapolis
  host: Mill City Running
  url: https://www.millcityrunning.com/pages/calendar
  description: Early run plus coffee at the Northeast store, 6:30 to 8:30 AM.
  # Nov 13 is Flapjack Friday (in events.yaml); Dec 25 and Jan 1 are holidays.
  skip: [2026-11-13, 2026-12-25, 2027-01-01]
  added: 2026-11-02

- id: polar-bears-saturday
  name: Polar Bears Group Run
  weekday: Sat
  start_time: "08:00"
  type: group-run
  distances: [3–10+ mi]
  venue: Rotating location (check with the host)
  city: Twin Cities
  host: Run Minnesota
  url: https://train.run-minnesota.org/page/show
  price: Free
  description: >-
    Winter Saturday group runs at rotating spots around Minneapolis, St. Paul, and the
    suburbs. All abilities welcome, typically 7:00 to 12:00+ min/mile.
  starts: 2026-11-07
  ends: 2027-02-27
  added: 2026-11-02
