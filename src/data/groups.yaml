# Local clubs, run groups, and shops.
- id: mill-city-running
  name: Mill City Running
  url: https://www.millcityrunning.com/pages/group-runs
  blurb: Running shop (Northeast Minneapolis and Highland St. Paul) with group runs Monday, Tuesday, Friday, and some Saturdays.
- id: mpls-run-club
  name: Mpls Run Club
  url: https://www.instagram.com/mplsrunclub
  blurb: Social Wednesday runs (6:30 AM and 6 PM) at rotating neighborhood spots, spring through fall.
- id: run-minnesota
  name: Run Minnesota
  url: https://train.run-minnesota.org/page/show
  blurb: Training programs and group runs.
- id: minneapolis-h3
  name: Minneapolis Hash House Harriers
  url: https://minneapolish3.com/
  blurb: "A drinking club with a running problem: 3–6 mile trails with a beer stop. Sundays (3 PM summer, 2 PM winter) and Thursdays at 7 PM (T3H3), rotating start spots."
- id: missing-link
  name: Missing Link Running
  url: https://missinglinkrunning.com/calendar
  blurb: Coach-led runs and workouts; the regular schedule returns in March.
- id: dirt-folk-trail
  name: Dirt Folk Trail
  url: https://www.strava.com/clubs/2280336
  blurb: Minneapolis trail running crew.
- id: tierra-rec-club
  name: Tierra Rec Club
  url: https://www.instagram.com/tierra.recclub/
- id: twin-cities-in-motion
  name: Twin Cities in Motion
  blurb: Organizers of the Twin Cities Marathon weekend.
