name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *' # hourly: picks up approved form submissions, drops past events
  workflow_dispatch:

permissions:
  contents: write # lets the build commit fresh scraped events back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scrapers/package-lock.json
      - run: npm ci
      # Scrapers never fail the deploy: on any problem they keep the last good
      # src/data/scraped/*.json and leave a warning on the run.
      - name: Scrape club calendars
        continue-on-error: true
        timeout-minutes: 10
        working-directory: scrapers
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node run.mjs
      - name: Save scraped events
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git add src/data/scraped
          if git diff --cached --quiet; then echo "No changes to scraped events"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update scraped events"
          git push || echo "::warning title=Scrapers::Couldn't push scraped events (main moved?); this deploy still uses them"
      - run: npm run build
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          BASE: /${{ github.event.repository.name }}
          SUBMISSIONS_CSV_URL: ${{ secrets.SUBMISSIONS_CSV_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
