name: Test scrapers and feeds

# Runs the scrapers without deploying, so they can be tuned from a branch.
# Download the "scrape-debug" artifact to see each page as the browser saw it.
on:
  push:
    branches-ignore: [main]
    paths: ['scrapers/**', 'src/data/feeds.yaml', '.github/workflows/scrape-test.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scrapers/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Check iCal feeds
        run: node check-feeds.mjs
      - name: Scrape (debug)
        run: node run.mjs
        env:
          DEBUG_DIR: ${{ github.workspace }}/scrape-debug
      - name: Show results
        if: always()
        run: |
          for f in ../src/data/scraped/*.json; do [ -e "$f" ] && { echo "== $f"; head -c 4000 "$f"; echo; }; done
          for f in ../scrape-debug/*/source.json; do [ -e "$f" ] && { echo "== $f"; node -e "const j=require('$f'); console.log('top-level keys:', Object.keys(j)); for (const [k,v] of Object.entries(j)) if (!Array.isArray(v)) console.log(k, JSON.stringify(v).slice(0,300))"; }; done
          for f in ../scrape-debug/*/network.json; do [ -e "$f" ] && { echo "== $f"; node -e "
            const n=require('$f'); console.log('frames:', n.frames); console.log('ics:', n.icsCandidates); console.log('pages fetched:', n.pagesFetched, JSON.stringify(n.pageAttempts)); console.log('buttons:', n.buttons);
            for (const r of n.responses) if (r.jsonEvents || /json|calendar|event/i.test(r.type+r.url)) console.log(r.status, r.method, r.jsonEvents ?? '-', r.type.split(';')[0], r.url.slice(0,200), r.post ? 'POST:'+r.post : '', r.keys ? 'KEYS:'+r.keys : '');
          "; }; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-debug
          path: |
            scrape-debug
            src/data/scraped
